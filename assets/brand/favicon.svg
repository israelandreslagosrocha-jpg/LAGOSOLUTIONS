<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <!-- LAGOSOLUTIONS App Icon / Favicon / Avatar -->
  <defs>
    <linearGradient id="fav-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1628"/>
      <stop offset="100%" stop-color="#060F22"/>
    </linearGradient>
    <linearGradient id="fav-orbit" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6BFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2D6BFF" stop-opacity="1"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="1"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Container Surface (Rounded Square for App / Avatar) -->
  <rect width="128" height="128" rx="28" fill="url(#fav-bg)"/>
  <rect width="126" height="126" x="1" y="1" rx="27" stroke="#1F2937" stroke-width="1.5" fill="none"/>

  <!-- Icon Geometry -->
  <g transform="translate(14, 14) scale(1.0)">
    <!-- Base Solid 'L' in Crisp White -->
    <path d="M26 18 H38 V66 H74 V78 H26 Z" fill="#F8FAFC"/>

    <!-- Orbital Energy Ring (Back segment) -->
    <path d="M16 68 C 12 76, 24 82, 42 78 C 60 74, 80 62, 88 50" 
          stroke="url(#fav-orbit)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.5"/>

    <!-- Orbital Energy Ring (Front crossing segment with Glow) -->
    <path d="M88 50 C 94 40, 84 32, 66 38 C 48 44, 28 58, 18 66" 
          stroke="url(#fav-orbit)" stroke-width="5" stroke-linecap="round" fill="none" filter="url(#fav-glow)"/>

    <!-- Exploration Probe / Rocket in Crisp White/Silver -->
    <g transform="translate(68, 36) rotate(-45)">
      <path d="M-2 18 Q 0 30 2 18 Z" fill="#2D6BFF" opacity="0.9"/>
      <ellipse cx="0" cy="18" rx="2.2" ry="5" fill="#93C5FD"/>
      <path d="M0 -14 C 4 -6, 5 8, 4 16 L -4 16 C -5 8, -4 -6, 0 -14 Z" fill="#FFFFFF"/>
      <path d="M-4 6 L -9 15 L -4 14 Z" fill="#CBD5E1"/>
      <path d="M4 6 L 9 15 L 4 14 Z" fill="#94A3B8"/>
      <ellipse cx="0" cy="-2" rx="2" ry="3.8" fill="#2D6BFF"/>
    </g>
  </g>
</svg>
