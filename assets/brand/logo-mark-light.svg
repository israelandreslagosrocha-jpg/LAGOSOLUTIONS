<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <!-- LAGOSOLUTIONS Isotype (Light version for dark backgrounds) -->
  <defs>
    <linearGradient id="orbit-grad-light" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2D6BFF" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#2D6BFF" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#93C5FD" stop-opacity="1"/>
    </linearGradient>
    <filter id="orbit-glow-light" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Solid 'L' Mark in Crisp White -->
  <path d="M26 18 H38 V66 H74 V78 H26 Z" fill="#F8FAFC"/>

  <!-- Orbital Energy Ring (Back segment) -->
  <path d="M16 68 C 12 76, 24 82, 42 78 C 60 74, 80 62, 88 50" 
        stroke="url(#orbit-grad-light)" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.5"/>

  <!-- Orbital Energy Ring (Front crossing segment with Glow) -->
  <path d="M88 50 C 94 40, 84 32, 66 38 C 48 44, 28 58, 18 66" 
        stroke="url(#orbit-grad-light)" stroke-width="4.5" stroke-linecap="round" fill="none" filter="url(#orbit-glow-light)"/>

  <!-- Exploration Probe / Sleek Rocket (Ascending at 45deg) -->
  <g transform="translate(68, 36) rotate(-45)">
    <!-- Propulsion Jet Flare -->
    <path d="M-2 18 Q 0 30 2 18 Z" fill="#2D6BFF" opacity="0.9"/>
    <ellipse cx="0" cy="18" rx="2" ry="5" fill="#93C5FD"/>
    
    <!-- Rocket Body (Fuselage) in Crisp White/Platinum with bevel -->
    <path d="M0 -14 C 4 -6, 5 8, 4 16 L -4 16 C -5 8, -4 -6, 0 -14 Z" fill="#FFFFFF"/>
    
    <!-- Wings / Fins in Silver/Navy tone -->
    <path d="M-4 6 L -9 15 L -4 14 Z" fill="#CBD5E1"/>
    <path d="M4 6 L 9 15 L 4 14 Z" fill="#94A3B8"/>
    
    <!-- Canopy / Sensor Window -->
    <ellipse cx="0" cy="-2" rx="1.8" ry="3.5" fill="#2D6BFF"/>
  </g>
</svg>
